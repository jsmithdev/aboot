[package]
name = "aboot"
version = "0.2.0"
edition = "2021"
description = "Agent Bootstrap: scaffold new projects — or add the LLM agent workflow to existing ones — so an AI coding agent can start working immediately."
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["scaffold", "cli", "ai", "workflow", "template"]

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
